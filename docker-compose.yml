services:
  servermoe:
    build: .
    container_name: servermoe
    ports:
      - "8080:8080"
    environment:
      MOE_SECRET: ${MOE_SECRET:-}
      MOE_ADMIN_TOKEN: ${MOE_ADMIN_TOKEN:-}
      SSC_SEAT_LIMIT: ${SSC_SEAT_LIMIT:-5}
    volumes:
      - servermoe-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  servermoe-data:
