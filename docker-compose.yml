services:
  ssc:
    build: .
    container_name: ssc-gateway
    ports:
      - "8080:8080"
    environment:
      SSC_SECRET: ${SSC_SECRET:-}
      SSC_ADMIN_TOKEN: ${SSC_ADMIN_TOKEN:-}
      SSC_SEAT_LIMIT: ${SSC_SEAT_LIMIT:-5}
    volumes:
      - ssc-data:/data
    restart: unless-stopped

volumes:
  ssc-data:
