name: release

# 推送形如 0.1.0 / v0.1.0 的 tag 时触发：
# 质量门禁 → 构建镜像 → 推送 Docker Hub（<tag> 与 latest）→ 创建 GitHub Release
on:
  push:
    tags: ["v*", "*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖与质量门禁
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ github.repository_owner }}/servermoe:${{ github.ref_name }}
            docker.io/${{ github.repository_owner }}/servermoe:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ServerMoe ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Docker 镜像

            ```bash
            docker pull ${{ github.repository_owner }}/servermoe:${{ github.ref_name }}
            ```
